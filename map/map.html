<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <title>GTA V - Render Targets</title>

    <meta name="author" content="Nicolai Skutsch">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      #map {
        height: 100%;
        background: #384950;
      }

      .ui-container {
        background: #FFFFFF;
        padding: 10px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        width: 200px;
        font-family: Arial, sans-serif;
      }

      label {
        font-size: 12px;
        font-weight: bold;
        display: block;
        margin-top: 6px;
      }

      input, select, button {
        width: 100%;
        margin-top: 4px;
        padding: 4px;
        box-sizing: border-box;
      }

      button:disabled {
        opacity: 0.5;
      }

      .delete-btn {
        background: #C0392B;
        color: white;
      }

      .glow {
        filter: drop-shadow(0 0 8px yellow);
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script>

      /* Settings */

      const SETTINGS = [
        { label: 'urban', display: 'Urban', color: 'blue' },
        { label: 'rural', display: 'Rural', color: 'green' },
        { label: 'drone', display: 'Drone', color: 'red' }
      ];

      const LAYER_BACKGROUND = {
        'Game': '#384950',
        'Print': '#4EB1D0',
        'Render': '#0D2B4F'
      };

      let selectedMarker = null;
      let isDragging = false;
      let suppressHistory = false;


      /* Layers */

      const locationsUrban = L.layerGroup();
      const locationsRural = L.layerGroup();
      const locationsDrone = L.layerGroup();

      const layerGame = L.tileLayer('https://s.rsg.sc/sc/images/games/GTAV/map/game/{z}/{x}/{y}.jpg', { noWrap: true });
      const layerPrint = L.tileLayer('https://s.rsg.sc/sc/images/games/GTAV/map/print/{z}/{x}/{y}.jpg', { noWrap: true });
      const layerRender = L.tileLayer('https://s.rsg.sc/sc/images/games/GTAV/map/render/{z}/{x}/{y}.jpg', { noWrap: true });


      /* Map */

      const map = L.map('map', {
        crs: L.CRS.Simple,
        center: [-98, 64],
        zoom: 2,
        minZoom: 2,
        maxZoom: 7,
        layers: [layerGame, locationsUrban, locationsRural, locationsDrone]
      });

      map.setMaxBounds([[0,0],[-192,128]]);

      L.control.layers(
        { 'Game': layerGame, 'Print': layerPrint, 'Render': layerRender },
        { 'Urban': locationsUrban, 'Rural': locationsRural, 'Drone': locationsDrone }
      ).addTo(map);

      map.on('baselayerchange', e => {
        document.getElementById('map').style.backgroundColor = LAYER_BACKGROUND[e.name];
      });


      /* UI Panel */

      const panel = L.control({ position: 'topleft' });
      panel.onAdd = function () {
        const div = L.DomUtil.create('div', 'ui-container');

        div.innerHTML = `
          <button id="importBtn">Import CSV</button>
          <button id="exportBtn">Export CSV</button>
          <button id="clearBtn">Clear Markers</button>

          <label>Setting</label>
          <select id="settingSelect"></select>

          <label>Pitch</label>
          <input id="pitch" type="number" value="0">

          <label>Roll</label>
          <input id="roll" type="number" value="0">

          <label>Yaw</label>
          <input id="yaw" type="number" value="0">

          <label>FOV</label>
          <input id="fov" type="number" value="50">

          <button id="applyBtn" disabled>Apply Changes</button>
          <button id="deleteBtn" class="delete-btn" disabled>Delete</button>
        `;

        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      panel.addTo(map);

      const settingSelect = document.getElementById('settingSelect');
      SETTINGS.forEach(s => {
        const o = document.createElement('option');
        o.value = s.label;
        o.textContent = s.display;
        settingSelect.appendChild(o);
      });

      const pitchInput = document.getElementById('pitch');
      const rollInput = document.getElementById('roll');
      const yawInput = document.getElementById('yaw');
      const fovInput = document.getElementById('fov');
      const applyBtn = document.getElementById('applyBtn');
      const deleteBtn = document.getElementById('deleteBtn');


      /* Coordinate conversion */

      function mapToGame(latlng) {
        const m = 0.01422, a = -119.5, b = 58.9;
        return [(latlng.lng - b) / m, (latlng.lat - a) / m];
      }

      function gameToMap(pos) {
        const m = 0.01422, a = -119.5, b = 58.9;
        return L.latLng(m * pos[1] + a, m * pos[0] + b);
      }

      function getLayerByLabel(label) {
        if (label === 'urban') return locationsUrban;
        if (label === 'rural') return locationsRural;
        return locationsDrone;
      }

      function getColor(label) {
        return SETTINGS.find(s => s.label === label).color;
      }


      /* Event Handler: Marker */

      function createMarker(latlng, setting, rot, fov, skipHistory=false) {
        const marker = L.circleMarker(latlng, {
          radius: 5,
          color: getColor(setting)
        });

        marker.data = { setting, rot, fov };

        marker.on('click', e => {
          e.originalEvent.markerClicked = true;
          selectMarker(marker);
        });

        enableDrag(marker);
        getLayerByLabel(setting).addLayer(marker);

        if (!skipHistory) saveHistory();
      }

      function enableDrag(marker) {
        marker.on('mousedown', () => {
          if (marker !== selectedMarker) return;
          isDragging = true;
          map.dragging.disable();
        });

        map.on('mousemove', e => {
          if (!isDragging || marker !== selectedMarker) return;
          marker.setLatLng(e.latlng);
        });

        map.on('mouseup', () => {
          if (isDragging) {
            isDragging = false;
            map.dragging.enable();
            saveHistory();
          }
        });
      }

      function selectMarker(marker) {
        deselectMarker();
        selectedMarker = marker;
        marker.setStyle({ color: 'yellow', radius: 7 });
        marker.getElement().classList.add('glow');

        settingSelect.value = marker.data.setting;
        pitchInput.value = marker.data.rot[0];
        rollInput.value = marker.data.rot[1];
        yawInput.value = marker.data.rot[2];
        fovInput.value = marker.data.fov;

        applyBtn.disabled = false;
        deleteBtn.disabled = false;
      }

      function deselectMarker() {
        if (!selectedMarker) return;
        selectedMarker.setStyle({ color: getColor(selectedMarker.data.setting), radius: 5 });
        selectedMarker.getElement().classList.remove('glow');
        selectedMarker = null;
        applyBtn.disabled = true;
        deleteBtn.disabled = true;
      }


      /* Event Handler: Map */

      map.on('click', e => {
        if (e.originalEvent.markerClicked) return;

        if (selectedMarker) {
          deselectMarker();
          return;
        }

        createMarker(
          e.latlng,
          settingSelect.value,
          [parseFloat(pitchInput.value), parseFloat(rollInput.value), parseFloat(yawInput.value)],
          parseFloat(fovInput.value)
        );
      });


      /* Event Handler: Buttons */

      applyBtn.onclick = () => {
        if (!selectedMarker) return;

        selectedMarker.data.setting = settingSelect.value;
        selectedMarker.data.rot = [
          parseFloat(pitchInput.value),
          parseFloat(rollInput.value),
          parseFloat(yawInput.value)
        ];
        selectedMarker.data.fov = parseFloat(fovInput.value);

        deselectMarker();
        saveHistory();
      };

      deleteBtn.onclick = () => {
        if (!selectedMarker) return;
        if (!confirm('Do you really want to delete this marker?')) return;

        getLayerByLabel(selectedMarker.data.setting).removeLayer(selectedMarker);
        selectedMarker = null;
        applyBtn.disabled = true;
        deleteBtn.disabled = true;
        saveHistory();
      };

      document.getElementById('clearBtn').onclick = () => {
        if (!confirm('Do you really want to clear all markers?')) return;

        locationsUrban.clearLayers();
        locationsRural.clearLayers();
        locationsDrone.clearLayers();
        saveHistory();
      };


      /* Import and Export */

      function exportCSV() {
        const header = 'setting;x;y;z;rot_x;rot_y;rot_z;fov;rendered';
        const rows = [header];

        function collect(layer) {
          layer.eachLayer(m => {
            const pos = mapToGame(m.getLatLng());
            rows.push(
              `${m.data.setting};${pos[0].toFixed(2)};${pos[1].toFixed(2)};0.00;${m.data.rot[0].toFixed(2)};${m.data.rot[1].toFixed(2)};${m.data.rot[2].toFixed(2)};${m.data.fov.toFixed(2)};False`
            );
          });
        }

        if (map.hasLayer(locationsUrban)) collect(locationsUrban);
        if (map.hasLayer(locationsRural)) collect(locationsRural);
        if (map.hasLayer(locationsDrone)) collect(locationsDrone);

        const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'render_targets.csv';
        link.click();
      }

      function importCSV(text) {
        suppressHistory = true;

        locationsUrban.clearLayers();
        locationsRural.clearLayers();
        locationsDrone.clearLayers();

        const lines = text.trim().split('\n');
        lines.shift();

        lines.forEach(line => {
          const p = line.split(';');
          createMarker(
            gameToMap([parseFloat(p[1]), parseFloat(p[2])]),
            p[0],
            [parseFloat(p[4]), parseFloat(p[5]), parseFloat(p[6])],
            parseFloat(p[7]),
            true
          );
        });

        suppressHistory = false;
        saveHistory();
      }

      document.getElementById('exportBtn').onclick = exportCSV;

      document.getElementById('importBtn').onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.csv';
        input.onchange = e => {
          const reader = new FileReader();
          reader.onload = () => importCSV(reader.result);
          reader.readAsText(e.target.files[0]);
        };
        input.click();
      };

      
      /* History */

      function exportState() {
        const data = [];
        [locationsUrban, locationsRural, locationsDrone].forEach(layer => {
          layer.eachLayer(m => {
            data.push({
              setting: m.data.setting,
              pos: mapToGame(m.getLatLng()),
              rot: m.data.rot,
              fov: m.data.fov
            });
          });
        });
        return data;
      }

      function restoreState(state) {
        suppressHistory = true;
        locationsUrban.clearLayers();
        locationsRural.clearLayers();
        locationsDrone.clearLayers();

        state.forEach(m => {
          createMarker(gameToMap(m.pos), m.setting, m.rot, m.fov, true);
        });

        suppressHistory = false;
      }

      function saveHistory() {
        if (suppressHistory) return;
        history.pushState(exportState(), '');
      }

      window.onpopstate = e => {
        if (e.state) restoreState(e.state);
      };


      /* Keyboard Shortcuts */

      document.addEventListener('keydown', e => {
        if (e.key === 'Delete' && selectedMarker) deleteBtn.click();
        if (e.ctrlKey && e.key === 'z') history.back();
        if (e.ctrlKey && e.key === 'y') history.forward();
      });

    </script>
  </body>
</html>
